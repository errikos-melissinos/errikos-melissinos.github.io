- project: "High Volatility is the Key: A Joint Treatment of Asset Pricing Puzzles"
  url: /pdfs/High_Volatility_is_the_Key_A_Joint_Treatment_of_Asset_Pricing_Puzzles.pdf
  description: Macrofinance faces a fundamental tension in that aggregate consumption volatility is low, yet risk premia are high. However, increasing evidence suggests that regular households are not marginal investors. This article models the marginal investor as a consumer with high, time-varying consumption volatility, motivated by the intermediary asset pricing perspective. This approach yields a joint explanation of five puzzles — the equity premium, the risk-free rate, the bond premium, stock return predictability, and excess volatility. Such stochastic volatility appears to be a necessary ingredient for jointly explaining these puzzles within any standard single-state-variable consumption-based model.

# A Perturbation Solution Method for Models with Recursive Utility
- project: A Perturbation Solution Method for Models with Recursive Utility
  # url: https://www.dropbox.com/s/hne0u10tjs37nss/recursive%20solution%20method.pdf?dl=0
  url: /pdfs/A_Perturbation_Solution_Method_For_Models_with_Recursive_Utility.pdf
  description: I illustrate a novel method for pricing assets within recursive utility models in continuous time, that has first been used in Melissinos (2023). My method builds on the analytic solution of Tsai and Wachter (2018). While their solution is valid for a value of the intertemporal elasticity of substitution equal to 1, I provide the full perturbation series in terms of the IES, which gives rise to a global perturbation approximation in terms of the state variable. This allows the pricing of assets for a much larger range of values for the IES, which are economically meaningful. I comment on the convergence properties of the perturbation series, and I show that the method provides a straightforward and reliable approach to asset pricing. I employ my method to derive prices of long-term bonds, the price consumption ratio and the instantaneous return of the consumption perpetuity. 
  
# Julia Package
- project: "SDFPricing: A Julia Package for Asset Pricing Based on a Stochastic Discount Factor Process"
  #role:  with Mariia Bondar
  # url: https://www.google.com/url?q=https%3A%2F%2Fwww.dropbox.com%2Fs%2F2ecm7tufxi9311a%2FBondar_Melissinos.pdf%3Fdl%3D0&sa=D&sntz=1&usg=AOvVaw3QxWNFiRpnKncGEu2-R5LZ
  url: /pdfs/SDFPricing.pdf
  description: I introduce a package in the Julia programming language to perform asset pricing based on a stochastic discount factor in continuous time. Prices are computed through Monte Carlo simulations according to a pricing partial differential equation and the corresponding Feynman-Kac formula. At this stage it is possible to compute a) prices of zero-coupon fixed income securities and b) price-dividend ratios, which also allow the calculation of prices and returns of these securities. The package is focused on ease of use and is meant to be used in research and teaching. I illustrate the functionality of the package with examples and an application. In particular, I show how asset prices react after shifts in economic variables within a consumption-based model, and I discuss to what extent these shifts can be classified as monetary policy shocks or information shocks in connection to monetary policy announcements.

